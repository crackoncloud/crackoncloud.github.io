<?xml version="1.0" encoding="UTF-8"?>
<!--
    The Gulp mark: the ouroboros, a snake that comes all the way round and puts its own tail in
    its mouth.

    The same geometry as composeApp/src/androidMain/res/drawable/ic_launcher_foreground.xml. Both
    are written by tools/app_icon.py in the app repository, which is the source of truth; if the
    generator changes, this changes in the same commit.

    The body is a filled outline rather than a stroked arc because it is *tapered* - thin at the
    tail, thick at the head - and that taper is what says which end of the ring is the animal. The
    head is unioned into the body, so there is no seam at the neck.

    The mark is scaled 1.3x about the centre of the 108 viewport relative to the adaptive
    foreground, because this file is rendered flat: a launcher masks an adaptive icon to the inner
    72 of its 108, so a flat render at 1.0 looks smaller in a store grid than the icon looks on a
    phone.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">

  <!-- launcher_background: the app's own night ground. -->
  <rect x="0" y="0" width="108" height="108" fill="#101827"/>


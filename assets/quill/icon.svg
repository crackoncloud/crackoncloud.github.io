<?xml version="1.0" encoding="UTF-8"?>
<!--
    The Quill mark: a white squircle glass holding the quill glyph and a coral dot, on the
    Ocean gradient (#4F86FF to #7A45D6 at 30 degrees).

    The same geometry as art/icon_glass.py in the app repository, which is the source of truth:
    the glass is 620/1024 of the square, the glyph is the 24-grid quill scaled to 400 px and
    nudged (+10, -10), the dot sits at (21, 19) of that grid. If the generator changes, this
    changes in the same commit.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="886.8" y2="512">
      <stop offset="0" stop-color="#4F86FF"/>
      <stop offset="1" stop-color="#7A45D6"/>
    </linearGradient>
    <clipPath id="glass"><path d="M512,202 C740,202 822,284 822,512 C822,740 740,822 512,822 C284,822 202,740 202,512 C202,284 284,202 512,202 Z"/></clipPath>
  </defs>

  <!-- launcher_background: the Ocean gradient. -->
  <rect width="1024" height="1024" fill="url(#g)"/>

  <!-- The glass: a superellipse, its glow beneath it. -->
  <path d="M512,222 C740,222 822,304 822,532 C822,760 740,842 512,842 C284,842 202,760 202,532 C202,304 284,222 512,222 Z" fill="#2B57DC" opacity=".18"/>
  <path d="M512,202 C740,202 822,284 822,512 C822,740 740,822 512,822 C284,822 202,740 202,512 C202,284 284,202 512,202 Z" fill="#FFFFFF"/>
  <rect x="202" y="810" width="620" height="12" fill="#000000" opacity=".1" clip-path="url(#glass)"/>

  <!-- The quill: the vane in the accent, its two lines in ink. 24-grid, k = 400/24, origin (322, 302). -->
  <g transform="translate(322 302) scale(16.6667)">
    <path d="M5,19 C7,13 11,8 19,4.5 C18.5,10 15,15 9,16.5 Z" fill="#2B57DC"/>
    <path d="M5,19 C7,13 11,8 19,4.5 C18.5,10 15,15 9,16.5 Z M5,19 L12.5,10.5" fill="none" stroke="#1E2140" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="5" cy="19" r=".55" fill="#1E2140"/>
    <circle cx="12.5" cy="10.5" r=".55" fill="#1E2140"/>
    <!-- The coral dot, bottom right of the quill. -->
    <circle cx="21" cy="19" r="2.52" fill="#EC4B52"/>
  </g>
</svg>
